<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payment Successful | QuizPro</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#2563eb,#4f46e5);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.card{

background:white;

width:550px;
max-width:100%;

border-radius:20px;

padding:50px;

text-align:center;

box-shadow:0 25px 60px rgba(0,0,0,.2);

}

.check{

width:100px;
height:100px;

margin:auto;

border-radius:50%;

background:#22c55e;

display:flex;
justify-content:center;
align-items:center;

font-size:50px;

color:white;

margin-bottom:25px;

}

h1{

font-size:38px;

color:#111827;

margin-bottom:10px;

}

.subtitle{

color:#6b7280;

line-height:1.7;

margin-bottom:35px;

}

.summary{

background:#f8fafc;

border-radius:15px;

padding:25px;

margin-bottom:35px;

}

.row{

display:flex;

justify-content:space-between;

padding:12px 0;

border-bottom:1px solid #e5e7eb;

}

.row:last-child{

border-bottom:none;

font-weight:700;

font-size:20px;

color:#2563eb;

}

button{

width:100%;

padding:18px;

background:#2563eb;

border:none;

border-radius:12px;

color:white;

font-size:18px;

font-weight:600;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#1d4ed8;

}

.note{

margin-top:25px;

color:#777;

font-size:14px;

line-height:1.7;

}

</style>

</head>

<body>

<div class="card">

<div class="check">
✓
</div>

<h1>Payment Successful!</h1>

<p class="subtitle">

Thank you for your purchase.

Your payment has been received and your practice exam is now unlocked.

</p>

<div class="summary">

<div class="row">
<span>Practice Exam</span>
<span>$9.99</span>
</div>

<div class="row">
<span>Access</span>
<span>Unlocked</span>
</div>

<div class="row">
<span>Total Paid</span>
<span>$9.99</span>
</div>

</div>

<button onclick="startExam()">

Start Exam →

</button>

<p class="note">

Your timer will begin once you start the exam.

Please make sure you have a stable internet connection before continuing.

</p>

</div>

<script>

function startExam(){

window.location.href="exam.html";

}

</script>

</body>
</html>
